[build]
  base = "frontend"
  command = "npm run build:prod"
  publish = "dist/frontend/browser"

[context.deploy-preview]
  command = "npm run build:staging"

[context.branch-deploy]
  command = "npm run build:staging"

[[redirects]]
  from = "/api/*"
  to = "https://tb-tours-api-prod.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
