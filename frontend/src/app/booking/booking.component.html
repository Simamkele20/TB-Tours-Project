<section class="booking section">
  <div class="heading">
    <p class="eyebrow">Online booking</p>
    <h1>Book your transport or tour</h1>
    <p>Complete the form to continue to secure payment and confirm your booking.</p>
  </div>

  <form [formGroup]="form" class="booking-form" (ngSubmit)="submitAndPay()">
    <label>
      Full Name *
      <input type="text" formControlName="fullName" />
    </label>
    <label>
      Email Address *
      <input type="email" formControlName="email" />
    </label>
    <label>
      Phone Number *
      <input type="tel" formControlName="phone" />
    </label>
    <label>
      Pickup Location *
      <input type="text" formControlName="pickupLocation" />
    </label>
    <label>
      Dropoff Location *
      <input type="text" formControlName="dropoffLocation" />
    </label>
    <label>
      Travel Date *
      <input type="date" formControlName="travelDate" />
    </label>
    <label>
      Passengers *
      <input type="number" min="1" max="60" formControlName="passengers" />
    </label>
    <label>
      Service *
      <select formControlName="serviceId">
        <option value="airport-transfer">Airport Transfer</option>
        <option value="private-tour">Private Tour</option>
        <option value="long-distance">Long-Distance Travel</option>
        <option value="wine-tour">Wine Tour</option>
        <option value="group-transport">Group Transport</option>
      </select>
    </label>
    <label class="full">
      Notes
      <textarea rows="4" formControlName="notes" placeholder="Pickup time, luggage count, special requests"></textarea>
    </label>

    @if (error()) {
      <p class="status error">{{ error() }}</p>
    }

    <div class="actions full">
      <button type="submit" class="btn btn-primary" [disabled]="isLoading()">{{ isLoading() ? "Preparing checkout..." : "Book and pay" }}</button>
    </div>
  </form>
</section>
